# create a release workflow from the main branch
name: Release LipidSpace

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: "ubuntu-latest"
    env:
        BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
        RELEASE_VERSION: ${{ github.ref_name }}
        OS: "Linux"
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    - name: Install dependencies
      run: |
        DEBIAN_FRONTEND=noninteractive sudo apt update
        sudo apt install -y --no-install-recommends \
        build-essential \
        libfontconfig1 \
        qt6-base-dev \
        qt6-base-dev-tools \
        libqt6svg6-dev \
        libqt6svgwidgets6 \
        libopenblas-dev \
        libomp-dev \
        mesa-common-dev \
        libglu1-mesa-dev \
        libc6 \
        libstdc++6

    - name: Build LipidSpace
      run: |
        qmake6 LipidSpace.pro
        make clean
        make build

    - name: Rename LipidSpace.zip to include RELEASE_VERSION
      run: |
        mv Build/LipidSpace.zip Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      # only upload binaries on release creation, not on manual trigger
      if: github.event_name != 'workflow_dispatch'
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        asset_name: LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true

  build-windows:
    runs-on: "windows-latest"
    env:
        BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
        RELEASE_VERSION: ${{ github.ref_name }}
        OS: "Windows"
        QT_VERSION: "6.5.3"
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        target: "desktop"
        host: "windows"
        arch: "win64_mingw"
        cache: "true"
        cache-key-prefix: "install-qt"
        set-env: "true"
        dir: ${{ runner.temp }}
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    - name: Prepare QT Project makefiles
      run: qmake6 LipidSpace.pro

    - name: Build LipidSpace
      run: mingw32-make

    - name: Package LipidSpace
      run: |
        win-build.bat
      shell: cmd

    - name: Rename LipidSpace.zip to include RELEASE_VERSION
      run: |
        move Build/LipidSpace.zip Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
      shell: cmd

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
        # only upload binaries on release creation, not on manual trigger
      if: github.event_name != 'workflow_dispatch'
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        asset_name: LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true

  build-macos-arm64:
    runs-on: macos-14
    env:
        BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
        RELEASE_VERSION: ${{ github.ref_name }}
        OS: "macOS-ARM64"
        # Signing and notarization are skipped when this is not configured, so
        # forks and dry runs still produce a (plain, unsigned) artifact.
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'

    - name: Install dependencies
      run: |
        brew install qt libomp openssl@3 cmake

    - name: Build LipidSpace
      run: |
        export PATH="/opt/homebrew/opt/qt/bin:$PATH"
        qmake6 LipidSpace.pro
        make release

    - name: Import Developer ID certificate
      if: env.MACOS_CERT_P12_BASE64 != ''
      env:
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
        security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
        rm -f "$RUNNER_TEMP/cert.p12"
        security find-identity -v -p codesigning

    - name: Deploy, sign, notarize and package
      if: env.MACOS_CERT_P12_BASE64 != ''
      env:
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      run: |
        export PATH="/opt/homebrew/opt/qt/bin:$PATH"
        export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
        trap 'rm -f "$ASC_KEY_PATH"' EXIT
        echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
        macos/sign-and-notarize.sh \
          --deploy \
          --dist-dir Build \
          --dist-name "LipidSpace-${RELEASE_VERSION}-${OS}"

    - name: Package unsigned (no signing secrets configured)
      if: env.MACOS_CERT_P12_BASE64 == ''
      run: |
        export PATH="/opt/homebrew/opt/qt/bin:$PATH"
        echo "::warning::MACOS_CERT_P12_BASE64 is not set - publishing an unsigned, un-notarized build"
        macdeployqt LipidSpace.app -verbose=1
        mkdir -p Build
        ditto -c -k --sequesterRsrc --keepParent \
          LipidSpace.app \
          "Build/LipidSpace-${RELEASE_VERSION}-${OS}.zip"

    - name: Remove the signing keychain
      if: always() && env.MACOS_CERT_P12_BASE64 != ''
      run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      # only upload binaries on release creation, not on manual trigger
      if: github.event_name != 'workflow_dispatch'
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.*
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
