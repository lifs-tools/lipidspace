# create a release workflow from the main branch
name: Release LipidSpace

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: "ubuntu-latest"
    env:
        BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
        # The git tag the release was cut from, e.g. "v1.2.1". LipidSpace.pro
        # compiles this into the binary as LIPIDSPACE_VERSION, so the About box,
        # the window title and the REST service all report the released version
        # instead of a hard-coded string. On a manual workflow_dispatch there is
        # no release payload and this falls back to the branch name.
        RELEASE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        OS: "Linux"
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
        # Needed so the tag is present for `git describe` if RELEASE_VERSION
        # is ever empty.
        fetch-depth: 0
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    - name: Install dependencies
      run: |
        DEBIAN_FRONTEND=noninteractive sudo apt update
        sudo apt install -y --no-install-recommends \
        build-essential \
        libfontconfig1 \
        qt6-base-dev \
        qt6-base-dev-tools \
        libqt6svg6-dev \
        libqt6svgwidgets6 \
        libopenblas-dev \
        libomp-dev \
        mesa-common-dev \
        libglu1-mesa-dev \
        libc6 \
        libstdc++6

    - name: Build LipidSpace
      run: |
        qmake6 LipidSpace.pro
        make clean
        make build

    - name: Rename LipidSpace.zip to include RELEASE_VERSION
      run: |
        mv Build/LipidSpace.zip Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      # only upload binaries on release creation, not on manual trigger
      if: github.event_name != 'workflow_dispatch'
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        asset_name: LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true

  build-windows:
    runs-on: "windows-latest"
    env:
        BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
        # The git tag the release was cut from, e.g. "v1.2.1". LipidSpace.pro
        # compiles this into the binary as LIPIDSPACE_VERSION, so the About box,
        # the window title and the REST service all report the released version
        # instead of a hard-coded string. On a manual workflow_dispatch there is
        # no release payload and this falls back to the branch name.
        RELEASE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        OS: "Windows"
        QT_VERSION: "6.5.3"
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        target: "desktop"
        host: "windows"
        arch: "win64_mingw"
        cache: "true"
        cache-key-prefix: "install-qt"
        set-env: "true"
        dir: ${{ runner.temp }}
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
        # Needed so the tag is present for `git describe` if RELEASE_VERSION
        # is ever empty.
        fetch-depth: 0
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    # See the matching step in build.yml for why this uses bash and -static.
    - name: Check vendored OpenXLSX headers match the vendored archive
      shell: bash
      run: |
        set -x
        command -v g++ || { echo "ERROR: g++ is not on PATH"; exit 1; }
        g++ --version | head -1
        ls -l libraries/OpenXLSX/bin/win64/libOpenXLSX.a examples/Example-Dataset.xlsx
        g++ -std=c++17 -O2 -static \
          -I libraries/OpenXLSX/include \
          tests/xlsx_smoke.cpp \
          libraries/OpenXLSX/bin/win64/libOpenXLSX.a \
          -o xlsx_smoke.exe || { echo "ERROR: smoke test failed to build"; exit 1; }
        ./xlsx_smoke.exe examples/Example-Dataset.xlsx

    - name: Prepare QT Project makefiles
      run: qmake6 LipidSpace.pro

    - name: Build LipidSpace
      run: mingw32-make release

    - name: Package LipidSpace
      run: |
        win-build.bat
      shell: cmd

    - name: Rename LipidSpace.zip to include RELEASE_VERSION
      run: |
        move Build/LipidSpace.zip Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
      shell: cmd

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
        # only upload binaries on release creation, not on manual trigger
      if: github.event_name != 'workflow_dispatch'
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        asset_name: LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true

  build-macos-arm64:
    runs-on: macos-14
    env:
        BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
        # The git tag the release was cut from, e.g. "v1.2.1". LipidSpace.pro
        # compiles this into the binary as LIPIDSPACE_VERSION, so the About box,
        # the window title and the REST service all report the released version
        # instead of a hard-coded string. On a manual workflow_dispatch there is
        # no release payload and this falls back to the branch name.
        RELEASE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        OS: "macOS-ARM64"
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
        # Needed so the tag is present for `git describe` if RELEASE_VERSION
        # is ever empty.
        fetch-depth: 0

    - name: Install dependencies
      run: |
        brew install qt libomp openssl@3 cmake

    - name: Build LipidSpace
      run: |
        export PATH="/opt/homebrew/opt/qt/bin:$PATH"
        qmake6 LipidSpace.pro
        make release

    - name: Package app bundle
      run: |
        mkdir -p Build
        ditto -c -k --sequesterRsrc --keepParent \
          LipidSpace.app \
          Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      # only upload binaries on release creation, not on manual trigger
      if: github.event_name != 'workflow_dispatch'
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Build/LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        asset_name: LipidSpace-${{ env.RELEASE_VERSION }}-${{ env.OS }}.zip
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true

  docker:
    name: Build, test and push LipidSpace Rest Docker image
    needs: build-linux
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: 'lifs/lipidspace'
      REGISTRY_NAME: 'docker.lifs-tools.org'
      # The released version is the image tag, rather than the run id that the
      # CI build (.github/workflows/build.yml) uses for its throwaway images.
      RELEASE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
        fetch-depth: 0

    - name: Login to LIFS Tools registry
      uses: docker/login-action@v1
      with:
        registry: docker.lifs-tools.org
        username: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_USER }}
        password: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_PW }}

    # RELEASE_VERSION is passed in as a build argument because git is not
    # installed in the build image, so version.pri cannot derive the version
    # itself and would fall back to LIPIDSPACE_FALLBACK_VERSION.
    - name: Build the Docker image
      run: |
        docker build . \
          --file LipidSpaceRest.docker \
          --build-arg RELEASE_VERSION=${{ env.RELEASE_VERSION }} \
          --tag ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

    # Guards against the image being built without the build argument, which
    # would silently ship a binary reporting LIPIDSPACE_FALLBACK_VERSION.
    - name: Test the image reports the released version
      run: |
        reported=$(docker run --rm ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }} --version)
        echo "Reported: $reported"
        case "$reported" in
          *"${{ env.RELEASE_VERSION }}"*) ;;
          *) echo "ERROR: expected version '${{ env.RELEASE_VERSION }}'"; exit 1 ;;
        esac

    - name: Start REST service container
      run: docker run --detach --name LipidSpaceRest -p8888:8888 --rm ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

    - name: Test response is expected
      run: |
        curl -X POST -v -H "Content-Type: application/json" --data-binary "@examples/Rest/Plasma-Singapore-Short.json" 127.0.0.1:8888/lipidspace/v1/pca

    - name: Test health endpoint returns UP
      run: |
        response=$(curl -s -w '\n%{http_code}' 127.0.0.1:8888/actuator/health)
        http_code=$(echo "$response" | tail -1)
        body=$(echo "$response" | head -1)
        echo "HTTP status: $http_code"
        echo "Body: $body"
        if [ "$http_code" != "200" ]; then
          echo "ERROR: expected HTTP 200, got $http_code"
          exit 1
        fi
        echo "$body" | grep -q '"status":"UP"' || { echo "ERROR: status is not UP"; exit 1; }

    - name: Stop REST service container
      run: docker stop LipidSpaceRest

    - name: Push Docker image
      # only push on release creation, not on manual trigger
      if: github.event_name != 'workflow_dispatch'
      run: docker push ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

    # 'latest' should not move backwards when an older patch release is cut,
    # and should never point at a pre-release.
    - name: Tag and push as latest
      if: github.event_name != 'workflow_dispatch' && github.event.release.prerelease == false
      run: |
        docker tag ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }} \
                   ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
        docker push ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
