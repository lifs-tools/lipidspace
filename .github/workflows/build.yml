name: Build LipidSpace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-linux:
    name: Build LipidSpace and LipidSpaceRest (Linux)
    runs-on: ubuntu-latest
    env:
      BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
      OS: "Linux"
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    - name: Install dependencies
      run: |
        DEBIAN_FRONTEND=noninteractive sudo apt update
        sudo apt install -y --no-install-recommends \
        build-essential \
        libfontconfig1 \
        qt6-base-dev \
        qt6-base-dev-tools \
        libqt6svg6-dev \
        libqt6svgwidgets6 \
        libopenblas-dev \
        libomp-dev \
        mesa-common-dev \
        libglu1-mesa-dev \
        libc6 \
        libstdc++6

    - name: Build LipidSpace
      run: |
        qmake6 LipidSpace.pro
        make clean
        make build
        make dist

    - name: Run unit tests (QtTest)
      run: |
        qmake6 tests/tests.pro
        make
        make check

    - name: Upload LipidSpace artifact
      uses: actions/upload-artifact@v4
      with:
        name: LipidSpace-${{ env.OS }}
        path: Build/LipidSpace.zip

    - name: Install CUDA 12.8 toolkit
      run: |
        distro=ubuntu$(. /etc/os-release; echo "$VERSION_ID" | tr -d .)
        wget -q https://developer.download.nvidia.com/compute/cuda/repos/${distro}/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cuda-nvcc-12-8 cuda-cudart-dev-12-8
        sudo ln -sfn /usr/local/cuda-12.8 /usr/local/cuda
        /usr/local/cuda/bin/nvcc --version

    - name: Build LipidSpaceRest (CUDA 12.8 GPU acceleration)
      # GitHub runners have no GPU, so this validates the CUDA compile only;
      # the binary uses the CPU fallback at runtime here.
      run: |
        qmake6 CONFIG+=cuda_gpu LipidSpaceRest.pro
        make clean
        make release

  build-windows:
    name: Build LipidSpace (Windows)
    runs-on: windows-latest
    env:
      BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
      OS: "Windows"
      QT_VERSION: "6.5.3"
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        target: "desktop"
        host: "windows"
        arch: "win64_mingw"
        cache: "true"
        cache-key-prefix: "install-qt"
        set-env: "true"
        dir: ${{ runner.temp }}

    - uses: actions/checkout@v3
      with:
        lfs: 'true'

    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    - name: Prepare QT Project makefiles
      run: qmake6 LipidSpace.pro

    - name: Build LipidSpace
      run: mingw32-make

    - name: Package LipidSpace
      run: |
        win-build.bat
      shell: cmd

    - name: Upload LipidSpace artifact
      uses: actions/upload-artifact@v4
      with:
        name: LipidSpace-${{ env.OS }}
        path: Build/LipidSpace.zip

  build-macos-arm64:
    name: Build LipidSpace (macOS ARM64)
    runs-on: macos-14
    env:
      BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}
      OS: "macOS-ARM64"
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'

    - name: Install dependencies
      run: |
        brew install qt libomp openssl@3 cmake

    - name: Build LipidSpace
      run: |
        export PATH="/opt/homebrew/opt/qt/bin:$PATH"
        qmake6 LipidSpace.pro
        make release

    - name: Run unit tests (QtTest)
      run: |
        export PATH="/opt/homebrew/opt/qt/bin:$PATH"
        qmake6 tests/tests.pro
        make
        make check

    - name: Package LipidSpace
      run: |
        mkdir -p Build
        ditto -c -k --sequesterRsrc --keepParent \
          LipidSpace.app \
          Build/LipidSpace.zip

    - name: Upload LipidSpace artifact
      uses: actions/upload-artifact@v4
      with:
        name: LipidSpace-${{ env.OS }}
        path: Build/LipidSpace.zip

  docker:
    name: Build, test and push LipidSpace Rest Docker image
    needs: build-linux
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: 'lifs/lipidspace'
      REGISTRY_NAME: 'docker.lifs-tools.org'
      BUILD_DATE: ${{ github.run_id }}.${{ github.run_attempt }}

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'true'
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"

    - name: Login to LIFS Tools registry
      uses: docker/login-action@v1
      with:
        registry: docker.lifs-tools.org
        username: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_USER }}
        password: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_PW }}

    - name: Build the Docker image
      run: docker build . --file LipidSpaceRest.docker --tag ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }}

    - name: Start REST service container
      run: docker run --detach --name LipidSpaceRest -p8888:8888 --rm ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }}

    - name: Test response is expected
      run: |
        curl -X POST -v -H "Content-Type: application/json" --data-binary "@examples/Rest/Plasma-Singapore-Short.json" 127.0.0.1:8888/lipidspace/v1/pca

    - name: Test health endpoint returns UP
      run: |
        response=$(curl -s -w '\n%{http_code}' 127.0.0.1:8888/actuator/health)
        http_code=$(echo "$response" | tail -1)
        body=$(echo "$response" | head -1)
        echo "HTTP status: $http_code"
        echo "Body: $body"
        if [ "$http_code" != "200" ]; then
          echo "ERROR: expected HTTP 200, got $http_code"
          exit 1
        fi
        echo "$body" | grep -q '"status":"UP"' || { echo "ERROR: status is not UP"; exit 1; }

    - name: Stop REST service container
      run: docker stop LipidSpaceRest

    - name: Push Docker image
      run: docker push ${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }}
