openapi: "3.0.2"
info:
    title: LipidSpace REST API
    version: "1.0"
    description: |
        REST API for LipidSpace — a tool for lipidome-wide PCA analysis.

        LipidSpace computes principal component analysis (PCA) on lipidome datasets,
        returning per-lipidome PCA coordinates, Hausdorff distance matrices between
        lipidomes, and a hierarchical clustering linkage matrix.

        ### Table formats

        The `Table` field is a CSV string with column names on the first row.
        Newlines must be encoded as `\n`. Three table layouts are supported:

        | TableType | Row meaning | Column meaning |
        |---|---|---|
        | `COLUMN_PIVOT_TABLE` | Sample | Lipid species (one per column) |
        | `ROW_PIVOT_TABLE` | Lipid species | Sample (one per column) |
        | `FLAT_TABLE` | One measurement | Sample + lipid columns |

        ### Column type tags

        Each column in the table must be labelled with a `TableColumnType`.
        The number of labels must match the number of columns.
servers:
    - url: https://apps.lifs-tools.org/lipidspace/v1
      description: Production server
    - url: http://localhost:8888/lipidspace/v1
      description: Local development server (default port)

components:
    schemas:
        TableType:
            type: string
            enum:
                - ROW_PIVOT_TABLE
                - COLUMN_PIVOT_TABLE
                - FLAT_TABLE
            description: |
                Layout of the CSV table:
                - `ROW_PIVOT_TABLE`: rows are lipid species, columns are samples
                - `COLUMN_PIVOT_TABLE`: rows are samples, columns are lipid species
                - `FLAT_TABLE`: one lipid measurement per row; sample and lipid identified by dedicated columns

        TableColumnType:
            type: string
            enum:
                - SampleColumn
                - QuantColumn
                - LipidColumn
                - StudyVariableColumnNumerical
                - StudyVariableColumnNominal
                - IgnoreColumn
            description: |
                Semantic type of a table column:
                - `SampleColumn`: sample identifier
                - `QuantColumn`: quantitative intensity values (used in FLAT_TABLE)
                - `LipidColumn`: lipid species name
                - `StudyVariableColumnNumerical`: continuous study variable (e.g. BMI, age)
                - `StudyVariableColumnNominal`: categorical study variable (e.g. gender, ethnicity)
                - `IgnoreColumn`: column skipped during analysis

        LipidSpacePcaRequest:
            type: object
            description: Request payload for the `/pca` endpoint.
            required:
                - TableType
                - TableColumnTypes
                - Table
            properties:
                TableType:
                    $ref: "#/components/schemas/TableType"
                TableColumnTypes:
                    type: array
                    description: |
                        One entry per column in the table (must match column count exactly).
                    items:
                        $ref: "#/components/schemas/TableColumnType"
                Table:
                    type: string
                    description: |
                        The full CSV table as a single string. The first row must contain
                        column names. Row separator must be encoded as `\n`
                        (literal backslash-n, not a real newline).
                RequestedSpaces:
                    type: array
                    description: |
                        Optional filter: only include the named spaces in the response.
                        Use `"global"` for the global lipidome aggregate,
                        `"LipidomeDistanceMatrix"` to include the distance and linkage matrices,
                        or individual sample names. When omitted all spaces are returned.
                    items:
                        type: string
                PcaDimensions:
                    type: integer
                    default: 2
                    minimum: 2
                    description: |
                        Number of PCA dimensions to return per lipidome. Defaults to `2`
                        (only `X`/`Y`), which keeps existing clients unchanged. When greater
                        than 2, each lipidome additionally includes a `PcaCoordinates` array.
                        Capped at the number of computed principal components.
                DistanceMetric:
                    type: string
                    enum: [hausdorff, hellinger]
                    default: hausdorff
                    description: |
                        Lipidome-to-lipidome distance used for `LipidomeDistanceMatrix` and the
                        clustering linkage: `hausdorff` (default, structural point-cloud distance)
                        or `hellinger` (the Atlas fingerprint — Hellinger distance between
                        compositional module histograms).
            example:
                TableType: "COLUMN_PIVOT_TABLE"
                TableColumnTypes:
                    - "SampleColumn"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNominal"
                    - "StudyVariableColumnNominal"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNumerical"
                    - "StudyVariableColumnNominal"
                    - "LipidColumn"
                    - "LipidColumn"
                    - "LipidColumn"
                    - "LipidColumn"
                    - "LipidColumn"
                    - "LipidColumn"
                    - "LipidColumn"
                Table: "Sample,BMI,Age,Gender,Ethnicity,cholesterol (mmol/l),Triglyceride (mmol/l),HDL-C (mmol/l),LDL-C (mmol/l),Fasting Glucose (mmol/L),SBP(mmHg),DBP(mmHg),Smoker,Cer(d18:0/20:0),Cer(d18:0/22:0),Cer(d18:0/24:0),Cer(d18:0/24:1),Cer(d18:1/16:0),Cer(d18:1/18:0),Cer(d18:1/20:0)\nM11081707,25.6,42,Male,Indian,4.88,0.87,0.97,3.56,4.6,132,95,0,82,325,438,1905,538,147,136\nM11062901,22.8,53,Female,Chinese,5.03,1.14,1.63,2.89,5.4,105,71,1,66,263,367,2253,555,167,159\nM11050509,25.9,52,Female,Malay,5.06,0.94,1.39,3.24,5.2,132,91,0,53,237,262,1786,444,183,139\nM11060206,18.9,56,Female,Chinese,5.47,0.5,2.28,2.58,4.5,165,81,0,44,134,230,1736,297,97,"

        LipidSpace:
            type: object
            description: PCA result for a single lipidome (sample, group, or global aggregate).
            required:
                - LipidomeName
                - LipidNames
                - Intensities
                - X
                - Y
            properties:
                LipidomeName:
                    type: string
                    description: Identifier of the lipidome (sample name, group label, or "global").
                LipidNames:
                    type: array
                    description: Normalised lipid species names in canonical form (cppGoslin notation).
                    items:
                        type: string
                ImportedLipidNames:
                    type: array
                    description: Original lipid names as supplied in the input table (parallel to `LipidNames`). Present when the server resolves import-name translations.
                    items:
                        type: string
                Intensities:
                    type: array
                    description: Normalised intensity (abundance) value for each lipid species (parallel to `LipidNames`).
                    items:
                        type: number
                        format: double
                X:
                    type: array
                    description: First PCA coordinate (PC1) for each lipid species (parallel to `LipidNames`).
                    items:
                        type: number
                        format: double
                Y:
                    type: array
                    description: Second PCA coordinate (PC2) for each lipid species (parallel to `LipidNames`).
                    items:
                        type: number
                        format: double
                PcaCoordinates:
                    type: array
                    description: |
                        Present only when the request sets `PcaDimensions` > 2. One array per
                        requested PCA dimension (column-major, same layout as `X`/`Y`); element
                        `0` equals `X`, element `1` equals `Y`.
                    items:
                        type: array
                        items:
                            type: number
                            format: double

        LipidSpaces:
            type: array
            description: Collection of per-lipidome PCA results.
            items:
                $ref: "#/components/schemas/LipidSpace"

        LipidomeDistanceMatrixRow:
            type: array
            description: One row of pairwise Hausdorff distances.
            items:
                type: number
                format: double

        LipidomeDistanceMatrix:
            type: array
            description: Square matrix of pairwise Hausdorff distances between lipidomes. Row/column order matches the order of sample lipidomes passed to the analysis.
            items:
                $ref: "#/components/schemas/LipidomeDistanceMatrixRow"

        LinkageMatrixRow:
            type: array
            description: "One merge step: [index1, index2, distance, cluster_size]"
            items:
                type: number
                format: double

        LinkageMatrix:
            type: array
            description: |
                Hierarchical clustering linkage matrix (compatible with
                `scipy.cluster.hierarchy.linkage` output). Each row encodes one
                agglomerative merge: `[index1, index2, distance, cluster_size]`.
            items:
                $ref: "#/components/schemas/LinkageMatrixRow"

        HealthStatus:
            type: string
            enum:
                - UP
                - DOWN
                - OUT_OF_SERVICE
                - UNKNOWN
            description: Spring Boot Actuator health status value.

        HealthComponent:
            type: object
            description: Status and optional diagnostic details for a single health component.
            required:
                - status
            properties:
                status:
                    $ref: "#/components/schemas/HealthStatus"
                details:
                    type: object
                    description: Component-specific diagnostic key/value pairs.
                    additionalProperties: true

        ActuatorHealthResponse:
            type: object
            description: |
                Health status response compatible with the Spring Boot Actuator
                `/actuator/health` endpoint schema.
            required:
                - status
            properties:
                status:
                    $ref: "#/components/schemas/HealthStatus"
                components:
                    type: object
                    description: Per-component health status breakdown.
                    additionalProperties:
                        $ref: "#/components/schemas/HealthComponent"

        LipidSpacePcaResponse:
            type: object
            description: Response returned by the `/pca` endpoint.
            required:
                - LipidSpaces
                - LipidomeDistanceMatrix
            properties:
                LipidSpaces:
                    $ref: "#/components/schemas/LipidSpaces"
                LipidomeDistanceMatrix:
                    $ref: "#/components/schemas/LipidomeDistanceMatrix"
                LinkageMatrix:
                    $ref: "#/components/schemas/LinkageMatrix"

paths:
    /actuator/health:
        servers:
            - url: https://apps.lifs-tools.org
              description: Production server
            - url: http://localhost:8888
              description: Local development server (default port)
        get:
            summary: Application health check
            operationId: getActuatorHealth
            description: |
                Returns the health status of the application in a format compatible with
                the Spring Boot Actuator `/actuator/health` endpoint schema.

                Reports an overall `status` (`UP` / `DOWN`) and a `diskSpace` component
                reflecting free storage on the configured temp folder (threshold: 10 MB).

                Returns HTTP 200 when healthy and HTTP 503 when any component is `DOWN`.
            responses:
                "200":
                    description: Application is healthy (`status: UP`).
                    content:
                        "application/json":
                            schema:
                                $ref: "#/components/schemas/ActuatorHealthResponse"
                            example:
                                status: "UP"
                                components:
                                    diskSpace:
                                        status: "UP"
                                        details:
                                            total: 499963174912
                                            free: 134217728000
                                            threshold: 10485760
                                            path: "/tmp/lipidspace"
                "503":
                    description: Application is unhealthy (`status: DOWN`), e.g. disk space below threshold.
                    content:
                        "application/json":
                            schema:
                                $ref: "#/components/schemas/ActuatorHealthResponse"
                            example:
                                status: "DOWN"
                                components:
                                    diskSpace:
                                        status: "DOWN"
                                        details:
                                            total: 499963174912
                                            free: 1048576
                                            threshold: 10485760
                                            path: "/tmp/lipidspace"

    /pca:
        post:
            summary: Run PCA on a lipidome quantity table
            operationId: postTablePca
            description: |
                Accepts a lipidome abundance table (CSV encoded as a JSON string) together
                with column-type annotations and returns:

                - Per-lipidome PCA coordinates (`LipidSpaces`)
                - Pairwise Hausdorff distance matrix (`LipidomeDistanceMatrix`)
                - Hierarchical clustering linkage matrix (`LinkageMatrix`)

                The server requires `Content-Type: application/json`.
                At least **3 distinct lipid species** across all samples must be provided,
                and at least **1 sample** must be present, otherwise a `400` error is returned.
            requestBody:
                required: true
                content:
                    "application/json":
                        schema:
                            $ref: "#/components/schemas/LipidSpacePcaRequest"
                        examples:
                            plasma-singapore-short:
                                summary: Plasma Singapore cohort (4 samples, 7 ceramide species)
                                value:
                                    TableType: "COLUMN_PIVOT_TABLE"
                                    TableColumnTypes:
                                        - "SampleColumn"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNominal"
                                        - "StudyVariableColumnNominal"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNominal"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                    Table: "Sample,BMI,Age,Gender,Ethnicity,cholesterol (mmol/l),Triglyceride (mmol/l),HDL-C (mmol/l),LDL-C (mmol/l),Fasting Glucose (mmol/L),SBP(mmHg),DBP(mmHg),Smoker,Cer(d18:0/20:0),Cer(d18:0/22:0),Cer(d18:0/24:0),Cer(d18:0/24:1),Cer(d18:1/16:0),Cer(d18:1/18:0),Cer(d18:1/20:0)\nM11081707,25.6,42,Male,Indian,4.88,0.87,0.97,3.56,4.6,132,95,0,82,325,438,1905,538,147,136\nM11062901,22.8,53,Female,Chinese,5.03,1.14,1.63,2.89,5.4,105,71,1,66,263,367,2253,555,167,159\nM11050509,25.9,52,Female,Malay,5.06,0.94,1.39,3.24,5.2,132,91,0,53,237,262,1786,444,183,139\nM11060206,18.9,56,Female,Chinese,5.47,0.5,2.28,2.58,4.5,165,81,0,44,134,230,1736,297,97,"
                            global-only:
                                summary: Same dataset — request only the global lipidome
                                value:
                                    TableType: "COLUMN_PIVOT_TABLE"
                                    TableColumnTypes:
                                        - "SampleColumn"
                                        - "StudyVariableColumnNumerical"
                                        - "StudyVariableColumnNominal"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                        - "LipidColumn"
                                    RequestedSpaces:
                                        - "global"
                                    Table: "Sample,BMI,Gender,Cer(d18:1/16:0),Cer(d18:1/18:0),Cer(d18:1/20:0)\nS1,25.6,Male,538,147,136\nS2,22.8,Female,555,167,159\nS3,25.9,Female,444,183,139"
            responses:
                "200":
                    description: Analysis succeeded.
                    content:
                        "application/json":
                            schema:
                                $ref: "#/components/schemas/LipidSpacePcaResponse"
                "400":
                    description: |
                        Invalid request. Possible causes:
                        - Malformed or non-object JSON body
                        - Missing required field (`TableType`, `TableColumnTypes`, `Table`)
                        - Unknown `TableType` or `TableColumnType` value
                        - Fewer than 3 lipid species recognised after parsing
                        - No valid lipidome could be constructed from the table
                "415":
                    description: |
                        Unsupported content type. The request `Content-Type` header must be
                        `application/json`.
                "500":
                    description: Unexpected server-side error (e.g. analysis failure, I/O error).

    /atlas/build:
        post:
            summary: Build an incremental Atlas from a set of lipidome datasets
            operationId: postAtlasBuild
            description: |
                Freezes a structural **frame** (each lipid's PCA coordinates over the
                Tanimoto lipid-distance space), fits **K** fixed k-means modules over that
                frame, fingerprints every dataset (an abundance-weighted, compositionally
                normalised histogram over the modules), and calibrates a confidence / OOD
                threshold from the atlas's own nearest-neighbour distance distribution.

                Returns the portable **atlas artifact** as JSON (`frame`, `centers`,
                `datasets`, `fingerprints`, `meta`, `nn_ref`, calibration). The caller
                persists it and passes it back to `/atlas/fit`. Building once is O(datasets);
                a dataset can later be added by fingerprinting it alone (O(size)) — no
                refit of the frame or modules is required.

                The request reuses the `/pca` table fields (`TableType`, `TableColumnTypes`,
                `Table`). Additional optional fields:

                - `Modules` (integer, default 20): number of k-means modules K.
                - `LabelVariable` (string): a nominal study-variable name to use for the
                  majority-vote prediction at fit time (e.g. `"tissue"`).
                - `FrameOnlySamples` (array of strings): sample names that define the frame
                  (their lipids enter the PCA space and modules) but are excluded from the
                  stored datasets and calibration. Use a support pseudo-sample carrying a broad
                  reference set (SwissLipids / LIPID MAPS) to build a stable support frame that
                  outlives the measured corpus. A sparse `FLAT_TABLE` is recommended for large
                  reference sets.

                Requires `Content-Type: application/json` and at least 3 lipid species.
            requestBody:
                required: true
                content:
                    "application/json":
                        schema:
                            type: object
                            required: [TableType, TableColumnTypes, Table]
                            properties:
                                TableType: { type: string }
                                TableColumnTypes:
                                    type: array
                                    items: { type: string }
                                Table: { type: string }
                                Modules: { type: integer, default: 20 }
                                LabelVariable: { type: string }
                                FrameOnlySamples:
                                    type: array
                                    items: { type: string }
            responses:
                "200":
                    description: Atlas built. Body is the atlas artifact (persist it for `/atlas/fit`).
                    content:
                        "application/json":
                            schema:
                                type: object
                                properties:
                                    dims: { type: integer }
                                    K: { type: integer }
                                    bandwidth: { type: number }
                                    ood_threshold: { type: number }
                                    label_variable: { type: string }
                                    frame:
                                        type: object
                                        additionalProperties:
                                            type: array
                                            items: { type: number }
                                    centers:
                                        type: array
                                        items:
                                            type: array
                                            items: { type: number }
                                    datasets:
                                        type: array
                                        items: { type: string }
                                    fingerprints:
                                        type: array
                                        items:
                                            type: array
                                            items: { type: number }
                                    meta:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: { type: string }
                                    nn_ref:
                                        type: array
                                        items: { type: number }
                "400":
                    description: Invalid request (bad table, fewer than 3 species, or no lipidomes).
                "415":
                    description: Unsupported content type. Use `application/json`.
                "500":
                    description: Unexpected server-side error.

    /atlas/fit:
        post:
            summary: Fit query lipidome(s) against a prebuilt Atlas
            operationId: postAtlasFit
            description: |
                Fingerprints one or more query lipidomes against a prebuilt atlas (passed
                inline as `Atlas`) and returns, per query: the nearest datasets with their
                metadata, an optional predicted label (majority vote over `LabelVariable`),
                a **confidence** in `[0, 1]` (the fraction of atlas datasets whose nearest
                neighbour is farther than this query's), an **`ood`** flag (nearest-neighbour
                distance above the calibrated threshold), **`coverage`** (the fraction of query
                lipids placed in the frame), and **`projected_lipids`** (how many were placed by
                Nystrom out-of-sample projection rather than direct frame lookup).

                Query lipids already present in the frozen frame are looked up directly; those
                that are not are projected into frame coordinates from their Tanimoto distance
                row to the reference lipids, so a query is no longer limited to the exact lipids
                the atlas was built on.

                The query table reuses the `/pca` fields (`TableType`, `TableColumnTypes`,
                `Table`). Additional fields:

                - `Atlas` (object, required): an atlas artifact from `/atlas/build`.
                - `NumNeighbors` (integer, default 5): neighbours to return / vote over.
                - `LabelVariables` (array of strings, optional): which nominal study variables to
                  predict by majority vote (e.g. `["tissue","species","disease"]`). Omit to predict
                  every nominal study variable stored in the atlas. Each is returned under
                  `predictions`; the build-time default `LabelVariable` is also echoed at the top
                  level as `prediction`/`vote`.

                Fitting is O(query size + datasets) and does not modify the atlas.
            requestBody:
                required: true
                content:
                    "application/json":
                        schema:
                            type: object
                            required: [Atlas, TableType, TableColumnTypes, Table]
                            properties:
                                Atlas: { type: object }
                                TableType: { type: string }
                                TableColumnTypes:
                                    type: array
                                    items: { type: string }
                                Table: { type: string }
                                NumNeighbors: { type: integer, default: 5 }
            responses:
                "200":
                    description: Fit succeeded.
                    content:
                        "application/json":
                            schema:
                                type: object
                                properties:
                                    results:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                query: { type: string }
                                                prediction: { type: string }
                                                vote: { type: number }
                                                predictions:
                                                    type: object
                                                    additionalProperties:
                                                        type: object
                                                        properties:
                                                            prediction: { type: string }
                                                            vote: { type: number }
                                                confidence: { type: number }
                                                nn_distance: { type: number }
                                                ood: { type: boolean }
                                                coverage: { type: number }
                                                projected_lipids: { type: integer }
                                                neighbors:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            dataset: { type: string }
                                                            distance: { type: number }
                                                            metadata:
                                                                type: object
                                                                additionalProperties: { type: string }
                "400":
                    description: Invalid request (missing/invalid `Atlas`, bad table, or no query lipidomes).
                "415":
                    description: Unsupported content type. Use `application/json`.
                "500":
                    description: Unexpected server-side error.
